<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60" fill="none">
  <defs>
    <linearGradient id="jmGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD165" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="jmTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFD165" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Emblem Badge -->
  <rect x="4" y="6" width="48" height="48" rx="12" fill="url(#jmGoldGrad)" filter="url(#goldGlow)" />
  <!-- Inner Monogram Icon (JM) -->
  <path d="M18 19 H30 V31 C30 35 27 37 23 37 H21" stroke="#0B0B0B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 19 V37 M32 19 L38 29 L44 19 V37" stroke="#0B0B0B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brand Typography -->
  <text x="64" y="32" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="21" letter-spacing="1.5" fill="url(#jmTextGrad)">JM CREATIONS</text>
  <text x="64" y="47" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#EAB308">CONSULTING &amp; AGENCY</text>
</svg>
